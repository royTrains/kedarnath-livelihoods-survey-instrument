स्कूल जाते हैं?","opt":false,"con":"x >= 0 && x <= NUM('n_children_6_14')","cmsg_en":"Cannot be more than the number of children aged 6 to 14.","cmsg_hi":"6 से 14 साल के बच्चों से ज़्यादा नहीं हो सकता।"},{"n":"n_earners","m":"A","t":"int","en":"How many of them, including you, earn money?","hi":"इनमें से कितने लोग, आपको मिलाकर, पैसा कमाते हैं?","opt":false,"con":"x >= 1 && x <= NUM('hhsize')","cmsg_en":"Cannot be more than the number of people in the household.","cmsg_hi":"घर के लोगों की संख्या से ज़्यादा नहीं हो सकता।"},{"n":"main_income_earner","m":"A","t":"one","en":"Among those who earn money, are you the main income earner in your household?","hi":"जो लोग कमाते हैं, उनमें सबसे ज़्यादा कमाने वाले आप ही हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]],"rel":"V('n_earners') > 1"},{"n":"occupation","m":"B","t":"one","en":"What is your main work during the Yatra season? Ask what they do and code the closest group; do not read the list aloud unless needed.","hi":"यात्रा के मौसम में आपका मुख्य काम क्या है?","opt":false,"c":[[1,"Pony/mule worker (works the animals, does not own them)","घोड़े/खच्चर वाला (जानवर चलाते हैं, मालिक नहीं)"],[2,"Pony/mule owner (owns the animals)","घोड़े/खच्चर का मालिक"],[3,"Porter (carries on own back/shoulders - goods, luggage, or a person in a kandi)","पोर्टर/कुली (अपनी पीठ या कंधे पर — सामान या कंडी में कोई व्यक्ति)"],[4,"Palki / dandi bearer (carries a person on a palanquin, as part of a team)","पालकी / डंडी वाला (पालकी पर व्यक्ति, कई लोग मिलकर)"],[5,"Dhaba, tea stall or food stall WORKER (prepared food or tea)","ढाबा, चाय या खाने की दुकान में काम (बना हुआ खाना या चाय)"],[6,"Dhaba, tea stall or food stall OWNER (prepared food or tea)","ढाबा, चाय या खाने की दुकान का मालिक"],[7,"Shop WORKER (goods: prasad, puja items, clothes, general store)","दुकान में काम (सामान: प्रसाद, पूजा का सामान, कपड़े, परचून)"],[8,"Shop OWNER (goods, not prepared food)","दुकान का मालिक (सामान, बना हुआ खाना नहीं)"],[9,"Hotel / lodge WORKER","होटल / लॉज में काम"],[10,"Hotel / lodge OWNER","होटल / लॉज का मालिक"],[11,"Driver (any motor vehicle)","ड्राइवर (कोई भी गाड़ी)"],[12,"Guide","गाइड"],[13,"Wage labourer (construction, loading, odd jobs)","दिहाड़ी मज़दूर (निर्माण, सामान चढ़ाना, फुटकर काम)"],[14,"Other","कोई और"]]},{"n":"occupation_detail","m":"B","t":"text","en":"In your own words, what exactly is your main work here? Write down what they say — what they actually do, and who for. Do not tick a box for this one.","hi":"अपने शब्दों में बताइए, यहाँ आपका मुख्य काम ठीक-ठीक क्या है? आप करते क्या हैं, और किसके लिए?","opt":false},{"n":"employment_type","m":"B","t":"one","en":"In this main work, are you: working on your own account without hired workers; running a business with hired workers; a regular monthly wage-earner; or a daily/casual wage-earner?","hi":"इस काम में आप क्या हैं: अपना काम खुद करते हैं और कोई नौकर नहीं रखते; अपना काम है और दूसरों को काम पर रखते हैं; महीने की पक्की तनख़्वाह पाते हैं; या दिहाड़ी पर काम करते हैं?","opt":false,"c":[[1,"Own-account (self-employed, no hired workers)","अपना काम, कोई नौकर नहीं"],[2,"Employer/business owner (self-employed)","मालिक, दूसरों को काम पर रखते हैं"],[3,"Regular wage or salary","महीने की पक्की तनख़्वाह"],[4,"Casual or daily wage labour","दिहाड़ी या रोज़ की मज़दूरी"],[5,"Unpaid family worker","घर के काम में बिना पैसे के हाथ बँटाते हैं"]]},{"n":"wage_employer","m":"B","t":"one","en":"Who employs you? A private company; a government or public body; a household (domestic work); a contractor or agent; or an individual employer?","hi":"आपको काम पर कौन रखता है? कोई निजी कंपनी; सरकारी या सार्वजनिक विभाग; कोई घर (घरेलू काम); ठेकेदार या एजेंट; या कोई व्यक्ति जो सीधे पैसे देता है?","opt":false,"hn":"ENUMERATOR: private company = a registered firm or hotel chain; government or public body = a government department, Yatra board, PWD or other public office; household = a family that hires them for domestic work; contractor or agent = a thekedar or agent who arranged and pays for the work; individual employer = one person who pays them directly, such as a shop or dhaba owner. If the respondent says 'the owner' or 'the boss' without more, ask who arranged the job. If they came through an agent (see the migration referral question), code 4. If unsure, code 97 and write the words in the notes.","hnh":"सर्वेक्षक के लिए: निजी कंपनी = रजिस्टर्ड फ़र्म या होटल; सरकारी = सरकारी विभाग, बोर्ड या सार्वजनिक दफ़्तर; घर = परिवार जो घरेलू काम कराता है; ठेकेदार या एजेंट = जिसने काम दिलाया और पैसे देता है; व्यक्ति = एक आदमी जो सीधे पैसे देता है, जैसे दुकान या ढाबे का मालिक। अगर सिर्फ़ 'मालिक' कहें तो पूछें काम किसने दिलाया। अगर एजेंट के ज़रिए आए हों तो 4 चुनें। पक्का न हो तो 97 चुनें और शब्द नोट में लिखें।","c":[[1,"Private company","निजी कंपनी"],[2,"Government or public body","सरकारी या सार्वजनिक विभाग"],[3,"A household (domestic work)","कोई घर (घरेलू काम)"],[4,"A contractor or agent","ठेकेदार या एजेंट"],[5,"An individual employer","कोई व्यक्ति जो सीधे पैसे देता है"],[97,"Don't know","पता नहीं"]],"rel":"V('employment_type') == 3 || V('employment_type') == 4"},{"n":"other_activity_types","m":"B","t":"multi","en":"Besides your main work, what other paid work do you do during the Yatra season? Check every one that applies; leave blank if there is none. Ask and code the closest group for each; do not read the list aloud unless needed.","hi":"वे कौन-कौन से काम हैं? जो-जो लागू हो, सब बताइए।","opt":true,"cfx":"occupation","hn":"ENUMERATOR: hauling luggage or goods on the back, shoulders or a head-load, for pilgrims or shops, is code 3 (porter). Carrying a person in a kandi is also code 3; carrying a person on a palanquin as part of a team is code 4. Hauling luggage or goods on a pony or mule is code 1 if the respondent works the animal for someone else, and code 2 if they own it.","hnh":"सर्वेक्षक के लिए: पीठ, कंधे या सिर पर सामान या लगेज ढोना (तीर्थयात्रियों या दुकानों के लिए) = कोड 3 (पोर्टर)। कंडी में इंसान ढोना भी कोड 3; पालकी या डंडी टीम में ढोना कोड 4। पोनी या खच्चर पर सामान ढोना: अगर किसी और का जानवर चलाते हैं तो कोड 1, अगर जानवर खुद का है तो कोड 2।","c":[[1,"Pony/mule worker (works the animals, does not own them)","घोड़े/खच्चर वाला (जानवर चलाते हैं, मालिक नहीं)"],[2,"Pony/mule owner (owns the animals)","घोड़े/खच्चर का मालिक"],[3,"Porter (carries on own back/shoulders - goods, luggage, or a person in a kandi)","पोर्टर/कुली (अपनी पीठ या कंधे पर — सामान या कंडी में कोई व्यक्ति)"],[4,"Palki / dandi bearer (carries a person on a palanquin, as part of a team)","पालकी / डंडी वाला (पालकी पर व्यक्ति, कई लोग मिलकर)"],[5,"Dhaba, tea stall or food stall WORKER (prepared food or tea)","ढाबा, चाय या खाने की दुकान में काम (बना हुआ खाना या चाय)"],[6,"Dhaba, tea stall or food stall OWNER (prepared food or tea)","ढाबा, चाय या खाने की दुकान का मालिक"],[7,"Shop WORKER (goods: prasad, puja items, clothes, general store)","दुकान में काम (सामान: प्रसाद, पूजा का सामान, कपड़े, परचून)"],[8,"Shop OWNER (goods, not prepared food)","दुकान का मालिक (सामान, बना हुआ खाना नहीं)"],[9,"Hotel / lodge WORKER","होटल / लॉज में काम"],[10,"Hotel / lodge OWNER","होटल / लॉज का मालिक"],[11,"Driver (any motor vehicle)","ड्राइवर (कोई भी गाड़ी)"],[12,"Guide","गाइड"],[13,"Wage labourer (construction, loading, odd jobs)","दिहाड़ी मज़दूर (निर्माण, सामान चढ़ाना, फुटकर काम)"],[14,"Other","कोई और"]]},{"n":"other_activity_income_pm","m":"B","t":"int","en":"Taking all of that other work together, about how much do you usually earn from it in a month? (Rs; leave blank if there is no other work)","hi":"वह सारा दूसरा काम मिलाकर, महीने में लगभग कितना कमा लेते हैं? (रुपये)","opt":true,"con":"x >= 0 && x <= 500000","cmsg_en":"Must be between Rs 0 and Rs 500000.","cmsg_hi":"यह रकम 0 से 500000 रुपये के बीच होनी चाहिए।"},{"n":"owns_shop_stall","m":"B","t":"one","en":"Does your household own a shop or stall that you use to earn?","hi":"क्या आपके घर की अपनी दुकान या खोखा है जिससे आप कमाते हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"employers_in_season","m":"B","t":"int","en":"During one Yatra season, how many different employers or businesses do you work in? (1 if you stay with the same one, or run the same one, all season)","hi":"एक यात्रा सीज़न में आप कितने अलग-अलग मालिकों के पास या कितने अलग-अलग कामों में काम करते हैं? (अगर पूरे सीज़न एक ही जगह रहते हैं या अपना एक ही काम चलाते हैं, तो 1 लिखें)","opt":false,"con":"x >= 1 && x <= 30","cmsg_en":"Must be between 1 and 30.","cmsg_hi":"1 से 30 के बीच होना चाहिए।"},{"n":"years_current_job","m":"B","t":"dec","en":"How many years have you been in this work? Write it as a decimal if needed, for example 1.5 for one year and six months, or 0.5 for six months.","hi":"अगर एक साल या ज़्यादा: आप इस काम में कितने साल से हैं? दशमलव में लिखें, जैसे डेढ़ साल के लिए 1.5।","opt":false,"hn":"ENUMERATOR: only if the person has been in this job one year or more. Write the number of years; use a decimal for part years (1.5 = one year and six months).","hnh":"अगर वे एक साल या उससे ज़्यादा से हैं तो साल लिखें। आधा या चौथाई साल हो तो दशमलव में लिखें (1.5 मतलब डेढ़ साल)।","con":"x >= 0 && x <= NUM('age') - 5","cmsg_en":"More years in this work than the respondent's age allows.","cmsg_hi":"उम्र के हिसाब से इतने साल नहीं हो सकते।"},{"n":"hours_day_yatra","m":"B","t":"int","en":"In the Yatra season, on a normal working day, how many hours do you work in total, across all your work?","hi":"यात्रा के मौसम में, आम दिन में आप कुल कितने घंटे काम करते हैं, सारे कामों को मिलाकर?","opt":false,"con":"x >= 1 && x <= 16","cmsg_en":"Hours a day must be between 1 and 16.","cmsg_hi":"दिन के घंटे 1 से 16 के बीच होने चाहिए।"},{"n":"days_week_yatra","m":"B","t":"int","en":"How many days a week do you usually work in the season?","hi":"सीज़न में आप हफ़्ते में कितने दिन काम करते हैं?","opt":false,"con":"x >= 1 && x <= 7","cmsg_en":"Days a week must be between 1 and 7.","cmsg_hi":"हफ़्ते के दिन 1 से 7 के बीच होने चाहिए।"},{"n":"prev_occ_change","m":"B","t":"one","en":"In the last ten years, did you change your main kind of work?","hi":"पिछले दस साल में, क्या आपने अपना मुख्य काम बदला?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"prev_occ","m":"B","t":"text","en":"What was your previous main work? Write down exactly what they say, in their words — do not pick from a list.","hi":"इससे पहले आपका मुख्य काम क्या था?","opt":false,"rel":"V('prev_occ_change') == 1"},{"n":"target_occ","m":"B","t":"text","en":"Looking ahead a few years, what work would you like to be doing? Write down exactly what they say, in their words — do not pick from a list, and do not prompt with examples. If they want to carry on exactly as they are, write that.","hi":"अगर यह काम बिल्कुल बंद हो जाए, तो आप कौन सा काम करेंगे?","opt":false},{"n":"prev_occ_reason","m":"B","t":"one","en":"What was the main reason you changed?","hi":"काम बदलने की मुख्य वजह क्या थी?","opt":false,"c":[[1,"Better income","ज़्यादा कमाई"],[2,"Lost the previous work","पहला काम छूट गया"],[3,"Work ended with the season","मौसम के साथ काम ख़त्म हो गया"],[4,"Family reasons","घर की वजह से"],[5,"Health or injury","सेहत या चोट"],[6,"Other","कोई और वजह"]],"rel":"V('prev_occ_change') == 1"},{"n":"months_worked_yatra","m":"C","t":"int","en":"In the past year, how many months did you work here in the Yatra season? Count the months you spent getting ready for it as well.","hi":"पिछले साल में आपने यात्रा के सीज़न में यहाँ कितने महीने काम किया? सीज़न की तैयारी के महीने भी गिनें।","opt":false,"con":"x >= 0 && x <= 12","cmsg_en":"Must be between 0 and 12 months.","cmsg_hi":"0 से 12 महीने के बीच होना चाहिए।"},{"n":"months_no_paid_work","m":"C","t":"int","en":"And in the past year, how many months did you have no paid work at all?","hi":"और पिछले साल में कितने महीने आपके पास कोई कमाई वाला काम नहीं था?","opt":false,"con":"x >= 0 && x + NUM('months_worked_yatra') <= 12","cmsg_en":"The Yatra months and the months with no work cannot add up to more than 12.","cmsg_hi":"यात्रा के महीने और बिना काम के महीने मिलाकर 12 से ज़्यादा नहीं हो सकते।"},{"n":"offseason_activity","m":"C","t":"one","en":"In the remaining months — not the Yatra season, and not the months with no work — what was your main work? Code the closest one.","hi":"बाकी महीनों में — जो यात्रा के सीज़न के नहीं थे और जिनमें काम भी था — आपका मुख्य काम क्या था? सबसे नज़दीकी चुनें।","opt":true,"c":[[2,"Farming (crops)","खेती (फ़सल)"],[3,"Livestock (animals)","पशुपालन (जानवर)"],[4,"Casual or daily wage labour","दिहाड़ी या रोज़ की मज़दूरी"],[5,"Construction work","निर्माण का काम"],[6,"Own small shop, stall or trade","अपनी छोटी दुकान, ठेला या धंधा"],[7,"Salaried job","तनख़्वाह वाली नौकरी"],[96,"Some other work","कोई और काम"],[0,"There were no such months","ऐसे कोई महीने नहीं थे"]]},{"n":"income_annual_total","m":"C","t":"int","en":"Thinking of the whole past year, about how much did you earn in total from all your work, after costs? (Rs)","hi":"पूरे पिछले साल को मिलाकर, सारे काम से ख़र्चा निकालकर आपने कुल कितना कमाया? (रुपये)","opt":true,"con":"x >= 1000 && x <= 10000000","cmsg_en":"Must be between Rs 1,000 and Rs 1 crore for the whole year. If they gave a monthly figure, multiply it.","cmsg_hi":"पूरे साल के लिए यह 1,000 से 1,00,00,000 रुपये के बीच होना चाहिए। अगर उन्होंने महीने का बताया है तो उसे गुणा करें।"},{"n":"pct_income_yatra","m":"C","t":"int","en":"Out of every 100 rupees of that, how many came from your Yatra work? (The rest is counted as coming from your other work.)","hi":"पूरे साल में आपने जो 100 रुपये कमाए, उनमें से कितने यात्रा के काम से आए? (बाकी दूसरे काम का माना जाएगा।)","opt":true,"rel":"V('income_annual_total') > 0","con":"x >= 0 && x <= 100","cmsg_en":"Must be between 0 and 100 out of every 100 rupees.","cmsg_hi":"हर 100 रुपये में से 0 से 100 के बीच होना चाहिए।"},{"n":"earnings_range","m":"C","t":"one","en":"Which range is closest to what you usually earn in a month from work? Under Rs 5,000; Rs 5,000 to 10,000; Rs 10,000 to 20,000; Rs 20,000 or more; or don't know?","hi":"आपकी एक महीने की कमाई लगभग किस दायरे में है? 5,000 रुपये से कम; 5,000 से 10,000; 10,000 से 20,000; 20,000 या उससे ज़्यादा; या पता नहीं?","opt":true,"c":[[1,"Under Rs 5,000","5,000 रुपये से कम"],[2,"Rs 5,000 to 10,000","5,000 से 10,000"],[3,"Rs 10,000 to 20,000","10,000 से 20,000"],[4,"Rs 20,000 or more","20,000 या ज़्यादा"],[97,"Don't know","पता नहीं"]],"rel":"!(V('income_annual_total') > 0)"},{"n":"hours_day_offseason","m":"C","t":"int","en":"In the months when the Yatra is closed and you are doing other work, on a normal working day, how many hours do you work in total?","hi":"जिन महीनों में यात्रा बंद रहती है और आप कोई दूसरा काम करते हैं, उनमें आम दिन में आप कुल कितने घंटे काम करते हैं?","opt":false,"rel":"12 - V('months_worked_yatra') - V('months_no_paid_work') > 0","con":"x >= 1 && x <= 16","cmsg_en":"Hours a day must be between 1 and 16.","cmsg_hi":"दिन के घंटे 1 से 16 के बीच होने चाहिए।"},{"n":"days_week_offseason","m":"C","t":"int","en":"In those months, how many days a week do you usually work?","hi":"उन महीनों में आप हफ़्ते में कितने दिन काम करते हैं?","opt":false,"rel":"12 - V('months_worked_yatra') - V('months_no_paid_work') > 0","con":"x >= 1 && x <= 7","cmsg_en":"Days a week must be between 1 and 7.","cmsg_hi":"हफ़्ते के दिन 1 से 7 के बीच होने चाहिए।"},{"n":"resp_returns_at_closure","m":"D","t":"one","en":"When the Yatra closes for the season, do YOU go to your home place?","hi":"जब यात्रा का मौसम ख़त्म हो जाता है, तो क्या आप अपने घर चले जाते हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"hh_at_home_place","m":"D","t":"one","en":"For most of the year, do the rest of your household live in your home village or town?","hi":"साल के ज़्यादातर समय, क्या आपके घर के बाक़ी लोग आपके गाँव या शहर में ही रहते हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"remit_differs_by_season","m":"D","t":"one","en":"Is the money you send home different in the Yatra season from when the Yatra is closed?","hi":"यात्रा के सीज़न में आप घर जो पैसा भेजते हैं, वह यात्रा बंद रहने के महीनों से अलग होता है?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"remit_out_yatra_pm","m":"D","t":"int","en":"In a normal month during the Yatra season, how much money do you usually send to family or others living elsewhere? (Rs, 0 if none)","hi":"यात्रा के मौसम के आम महीने में, आप घर या कहीं और रहने वालों को कितना पैसा भेजते हैं? (रुपये, न भेजते हों तो 0)","opt":false,"con":"x >= 0 && x <= 300000","cmsg_en":"Must be between Rs 0 and Rs 300000.","cmsg_hi":"यह रकम 0 से 300000 रुपये के बीच होनी चाहिए।"},{"n":"remit_out_offseason_pm","m":"D","t":"int","en":"In a normal month when the Yatra is closed, how much do you usually send? (Rs, 0 if none)","hi":"जब यात्रा बंद रहती है, उस आम महीने में कितना भेजते हैं? (रुपये, न भेजते हों तो 0)","opt":false,"rel":"V('remit_differs_by_season') == 1","con":"x >= 0 && x <= 300000","cmsg_en":"Must be between Rs 0 and Rs 300000.","cmsg_hi":"यह रकम 0 से 300000 रुपये के बीच होनी चाहिए।"},{"n":"remit_mode","m":"D","t":"one","en":"How do you usually send it?","hi":"आप पैसा आम तौर पर कैसे भेजते हैं?","opt":false,"c":[[1,"From my own phone (UPI or net banking)","अपने फ़ोन से (UPI या नेट बैंकिंग)"],[2,"In person at a bank branch or bank mitra / CSP","ख़ुद जाकर बैंक शाखा या बैंक मित्र / CSP पर"],[3,"Money order or post office","मनीऑर्डर या डाकघर से"],[4,"Sent with someone going home","घर जा रहे किसी के हाथ"],[5,"Carried it myself","ख़ुद लेकर गए"],[6,"Through an agent or middleman","किसी एजेंट या बिचौलिए के ज़रिए"],[7,"Other","कोई और तरीक़ा"]],"rel":"V('remit_out_yatra_pm') > 0 || V('remit_out_offseason_pm') > 0"},{"n":"remit_in_yatra_pm","m":"D","t":"int","en":"In a normal month during the Yatra season, how much money do you usually receive from family or others? (Rs, 0 if none)","hi":"यात्रा के मौसम के आम महीने में, घरवालों या किसी और से आपको कितना पैसा मिलता है? (रुपये, न मिलता हो तो 0)","opt":false,"con":"x >= 0 && x <= 300000","cmsg_en":"Must be between Rs 0 and Rs 300000.","cmsg_hi":"यह रकम 0 से 300000 रुपये के बीच होनी चाहिए।"},{"n":"remit_in_offseason_pm","m":"D","t":"int","en":"In a normal month when the Yatra is closed, how much do you usually receive? (Rs, 0 if none)","hi":"जब यात्रा बंद रहती है, उस आम महीने में कितना मिलता है? (रुपये, न मिलता हो तो 0)","opt":false,"rel":"V('remit_differs_by_season') == 1","con":"x >= 0 && x <= 300000","cmsg_en":"Must be between Rs 0 and Rs 300000.","cmsg_hi":"यह रकम 0 से 300000 रुपये के बीच होनी चाहिए।"},{"n":"n_hh_same_business","m":"D","t":"int","en":"How many people from your household work in the same business or establishment as you, counting yourself?","hi":"आपके घर के कितने लोग आपके साथ उसी काम या उसी दुकान/धंधे में काम करते हैं, आपको भी गिनकर?","opt":false,"con":"x >= 0 && x <= NUM('hhsize')","cmsg_en":"Cannot be more than the number of people in the household.","cmsg_hi":"घर के लोगों की संख्या से ज़्यादा नहीं हो सकता।"},{"n":"years_coming_here","m":"D","t":"int","en":"How many years have you been coming here for the Yatra season?","hi":"आप कितने सालों से यात्रा के मौसम में यहाँ आ रहे हैं?","opt":false,"rel":"V('resp_returns_at_closure') == 1","con":"x >= 0 && x <= NUM('age') - 5","cmsg_en":"More years coming here than the respondent's age allows.","cmsg_hi":"उम्र के हिसाब से इतने साल नहीं हो सकते।"},{"n":"came_here_reason","m":"D","t":"one","en":"What was the main reason you first came here to work?","hi":"आप सबसे पहले यहाँ काम करने किस मुख्य वजह से आए थे?","opt":false,"c":[[1,"No work at home","घर पर काम नहीं था"],[2,"Pay is better here","यहाँ मज़दूरी बेहतर है"],[3,"Family or people from my village were already here","घरवाले या गाँव के लोग पहले से यहाँ थे"],[4,"Land at home is too little to live on","घर पर ज़मीन इतनी कम है कि गुज़ारा नहीं होता"],[5,"Debt to repay","क़र्ज़ चुकाना था"],[6,"A contractor or agent brought me","कोई ठेकेदार या एजेंट लेकर आया"],[7,"Married into / moved with family","शादी होकर / परिवार के साथ आए"],[8,"Some other reason","कोई और वजह"]],"rel":"V('origin') != 1"},{"n":"came_here_reason_other","m":"D","t":"text","en":"What was that reason? Write down what they say.  care but could not get it?","hi":"पिछले 3 महीनों में क्या कभी ऐसा हुआ कि आपके घर में किसी को इलाज की ज़रूरत थी पर मिल नहीं पाया?","opt":true,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"child_death_5y","m":"H","t":"one","en":"In the last five years, has any child or young person under 18 in your household died?","hi":"पिछले पाँच साल में क्या आपके घर के 18 साल से छोटे किसी बच्चे या किशोर की मृत्यु हुई?","opt":true,"hn":"Say the lead-in before you ask: \"The next question is about a death in the family. You do not have to answer it.\" Then ask it once. Do NOT probe, do not ask for details, and do not ask again if they go quiet -- leave it blank and move on. A blank here is a correct and complete answer; NITI's own rule treats an unanswered mortality item as not deprived.","hnh":"Say the lead-in before you ask: \"The next question is about a death in the family. You do not have to answer it.\" Then ask it once. Do NOT probe, do not ask for details, and do not ask again if they go quiet -- leave it blank and move on. A blank here is a correct and complete answer; NITI's own rule treats an unanswered mortality item as not deprived.","c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"birth_last_5y","m":"H","t":"one","en":"In the last five years, did any woman in your household give birth?","hi":"पिछले पाँच साल में क्या आपके घर की किसी महिला ने बच्चे को जन्म दिया?","opt":true,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"anc_4_visits","m":"H","t":"one","en":"For the most recent birth, did she have at least four check-ups before the delivery?","hi":"सबसे हाल के जन्म के लिए, क्या डिलीवरी से पहले उनकी कम से कम चार बार जाँच हुई थी?","opt":true,"hn":"Ask the mother herself if she is there. If not, probe: did she go for check-ups before the birth, and about how many times? Four or more is Yes; two or three is No. Do not accept a shrug — ask how many times she went.","hnh":"अगर माँ वहीं हैं तो उनसे ही पूछिए। नहीं तो कुरेदिए: डिलीवरी से पहले वे जाँच कराने गई थीं, और लगभग कितनी बार? चार ld do.","c":[[1,"Support","समर्थन में"],[2,"Neutral","तटस्थ"],[3,"Oppose","विरोध में"],[98,"Prefer not to say","बताना नहीं चाहते"]]},{"n":"ropeway_expect_work","m":"J","t":"one","en":"If the ropeway is built, what do you think will happen to your own work? More work for you; less work; about the same; or don't know?","hi":"अगर रोपवे बन गया, तो आपके अपने काम पर क्या असर होगा? मेरे लिए ज़्यादा काम; मेरे लिए कम काम; लगभग वैसा ही; या पता नहीं?","opt":false,"c":[[1,"More work for me","मेरे लिए ज़्यादा काम"],[2,"Less work for me","मेरे लिए कम काम"],[3,"About the same","लगभग वैसा ही"],[97,"Don't know","पता नहीं"]]},{"n":"ropeway_expect_jobs","m":"J","t":"one","en":"Who do you think will get most of the jobs the ropeway creates? People from these villages; people from outside the area; nobody will get jobs; or don't know?","hi":"रोपवे में जो नौकरियाँ बनेंगी, वे ज़्यादातर किसे मिलेंगी? इन गाँवों के लोगों को; इलाके के बाहर के लोगों को; किसी को नहीं मिलेंगी; या पता नहीं?","opt":false,"c":[[1,"People from these villages","इन गाँवों के लोगों को"],[2,"People from outside the area","इलाके के बाहर के लोगों को"],[3,"Nobody will get jobs","किसी को नहीं मिलेंगी"],[97,"Don't know","पता नहीं"]]},{"n":"ropeway_trust","m":"J","t":"one","en":"Do you think the ropeway will improve the livelihoods of people here? Yes; no; or don't know?","hi":"क्या आपको लगता है कि रोपवे से यहाँ के लोगों की रोज़ी-रोटी सुधरेगी? हाँ; नहीं; या पता नहीं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"],[97,"Don't know","पता नहीं"]]},{"n":"trek_dependent","m":"J","t":"one","en":"Is your main work carrying, transporting or guiding people or goods on foot along the pilgrimage trek?","hi":"क्या आपका मुख्य यात्रा-काम गौरीकुंड से केदारनाथ के पैदल रास्ते पर लोगों या सामान को ले जाना, पहुँचाना या रास्ता दिखाना है?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"contract_status","m":"K","t":"one","en":"Do you have a signed contract? Yes, signed; yes but not yet signed; no contract.","hi":"क्या आपका दस्तख़त किया ,"c":[[1,"Yes, free to use","हाँ, बिना पैसे के"],[2,"A source exists but we must pay","स्रोत है, पर पैसे देने पड़ते हैं"],[3,"No source nearby","पास में कोई स्रोत नहीं है"],[97,"Don't know","पता नहीं"]]},{"n":"cpr_governance","m":"M","t":"one","en":"In the Yatra region or workplace region, who decides who may use the common land and forest? Ask and code what they name; do not read the list.","hi":"यात्रा क्षेत्र या काम की जगह की साझा ज़मीन और जंगल का फ़ैसला कौन करता है, कि कौन उसका इस्तेमाल कर सकता है? जो नाम लें वही लिख लें; सूची न पढ़ें।","opt":true,"c":[[1,"Village head or panchayat","गाँव के प्रधान या पंचायत"],[2,"Forest department","वन विभाग"],[3,"Local committee or community group","गाँव या समूह की समिति"],[4,"Nobody decides; it is open to all","कोई तय नहीं करता, सब के लिए खुला है"],[97,"Don't know","पता नहीं"]]}],"mods":[{"c":"P","en":"Cover page, consent and paradata","hi":"आवरण और सहमति","ien":"","ihi":""},{"c":"A","en":"Respondent and household","hi":"आप और आपका घर","ien":"First, a few things about you and the people who live in your household.","ihi":"सबसे पहले आपके बारे में और आपके घर में रहने वाले लोगों के बारे में कुछ बातें पूछूँगा।"},{"c":"B","en":"Work and work history","hi":"काम और काम का इतिहास","ien":"Now about the work you do here on the Yatra route, and the work you did before this.","ihi":"अब उस काम के बारे में जो आप यहाँ यात्रा मार्ग पर करते हैं, और उससे पहले जो काम करते थे।"},{"c":"C","en":"Monthly calendar of work and income","hi":"साल भर का काम और कमाई","ien":"Now I want to go through the last twelve months, one month at a time. For each month I will ask what work you were mainly doing, and then what you usually earned. It is easiest to start with the Yatra months and fill the rest afterwards.","ihi":"अब मैं पिछले बारह महीनों के बारे में, एक-एक महीना करके पूछूँगा। हर महीने के लिए पूछूँगा कि आप मुख्य रूप से क्या काम कर रहे थे, और फिर यह कि आमतौर पर कितना कमाया। सबसे आसान यह रहता है कि पहले यात्रा वाले महीने भर लें, बाक़ी बाद में।"},{"c":"D","en":"Migration, home place and remittances","hi":"आना-जाना और घर की जगह","ien":"Now a few questions about where your home is, and what you do when the Yatra closes for the season.","ihi":"अब कुछ सवाल इस बारे में कि आपका घर कहाँ है, और यात्रा का मौसम ख़त्म होने पर आप क्या करते हैं।"},{"c":"E","en":"Household consumption","hi":"घर का ख़र्च","ien":"Now about what your household usually spends in a month. For each thing I will ask twice — once for a normal month during the Yatra season, and once for a normal month when the Yatra is closed — because spending is often quite different in the two. Rough figures are fine.","ihi":"अब यह कि आपके घर का एक महीने में आमतौर पर कितना ख़र्च होता है। हर चीज़ के लिए मैं दो बार पूछूँगा — एक बार यात्रा के मौसम के आम महीने के लिए, और एक बार उस महीने के लिए जब यात्रा बंद रहती है — क्योंकि दोनों में ख़र्च अक्सर काफ़ी अलग होता है। अंदाज़े का हिसाब ही ठीक है।"},{"c":"F","en":"Housing, amenities and assets","hi":"मकान, सुविधाएँ और सामान","ien":"Now some questions about your house and the things your household has.","ihi":"अब आपके घर और घर में मौजूद सामान के बारे में कुछ सवाल।"},{"c":"G","en":"Finance, insurance and schemes","hi":"बैंक, बीमा और योजनाएँ","ien":"Now about savings, loans, insurance and government schemes.","ihi":"अब बचत, क़र्ज़, बीमा और सरकारी योजनाओं के बारे में।"},{"c":"H","en":"Health","hi":"सेहत","ien":"Now a few questions about health in your household. You may leave out any of these.","ihi":"अब आपके घर में सेहत के बारे में कुछ सवाल। इनमें से कोई भी सवाल आप छोड़ सकते हैं।"},{"c":"I","en":"Food security, shocks and coping","hi":"खाना, मुश्किलें और उनसे निपटना","ien":"Now about food, and about any difficult times in the last year and how your household managed.","ihi":"अब खाने के बारे में, और पिछले साल आई किसी मुश्किल के बारे में कि आपके घर ने उसे कैसे सँभाला।"},{"c":"J","en":"Ropeway","hi":"रोपवे","ien":"Now a few questions about the ropeway that has been proposed for this route. It is only a proposal — nothing has been built. There is no right answer and nothing you say here goes to anyone but us.","ihi":"अब गौरीकुंड से केदारनाथ के बीच जो रोपवे प्रस्तावित है, उस पर दो सवाल।"},{"c":"K","en":"Job quality (Apablaza et al. 2026 questions)","hi":"काम की गुणवत्ता","ien":"Now a set of questions about the conditions of your work — hours, pay, contract and so on. These come from a standard list used in many countries, so one or two may not fit your situation. Say so and we will move on.","ihi":"अब आपके काम के हालात पर कुछ सवाल — घंटे, मज़दूरी, ठेका वग़ैरह। ये एक बनी-बनाई सूची से हैं जो कई देशों में इस्तेमाल होती है, इसलिए एक-दो सवाल आपकी स्थिति पर शायद ठीक न बैठें। बता दीजिएगा, हम आगे बढ़ जाएँगे।"},{"c":"L","en":"Tasks and skills (short block)","hi":"काम-काज और हुनर","ien":"Now I will read out some kinds of work-tasks and ask whether you do them. There is no right or wrong answer — we are trying to understand what skills the work here actually uses.","ihi":"आख़िर में, मैं कुछ तरह के कामों के नाम पढ़ूँगा और पूछूँगा कि आप वे करते हैं या नहीं। इसमें सही या ग़लत जवाब कुछ नहीं है — हम बस यह समझना चाहते हैं कि यहाँ के काम में कौन-कौन से हुनर लगते हैं।"},{"c":"M","en":"Access to common resources (short block)","hi":"Access to common resources (short block)","ien":"Last, a few questions about the forest and common land around where you work — firewood, fodder, grazing and water. Some of this is not allowed in some places, and that is a perfectly good answer: we only want to know what is possible and what is not. Nothing you say goes to the Forest Department or to anyone else, and you can leave any of these out.","ihi":"आख़िर में, जहाँ आप काम करते हैं उसके आसपास के जंगल और सार्वजनिक ज़मीन के बारे में कुछ सवाल — लकड़ी, चारा, चराई और पानी। कहीं-कहीं इनमें से कुछ करना मना होता है, और यह भी पूरा सही जवाब है: हम सिर्फ़ यह जानना चाहते हैं कि क्या हो सकता है और क्या नहीं। आपकी बात वन विभाग या किसी और तक नहीं जाएगी, और आप इनमें से कोई भी सवाल छोड़ सकते हैं।"}],"cols":["resp_id","enum_id","site","form_build","i let L = 1;                                  // 0 = Hindi, 1 = English (default: English)
const t = k => T[k][L];
const KEY = "kedarnath_v1", DKEY = "kedarnath_draft";
let D = {}, shown = [];
const QBY = Object.fromEntries(CFG.q.map(q => [q.n, q]));
// Which screen is showing. The language toggle used to INFER this from idx, which got it
// wrong twice: after a refused consent idx is still inside the question list, so switching
// language dropped the enumerator back into an interview that had already been saved and
// closed; and on the completion screen it jumped to the menu instead of re-rendering.
let screen = "menu", lastRefused = false;
// Position is tracked by question NAME, never by index. shown[] is rebuilt from the relevance
// rules on every render, so answering a gate question changes its length and every index after
// that point silently refers to a different question, which looked, from the field, like typed
// answers disappearing. `cur` survives that; an index cannot.
// Navigation is per MODULE, not per question: the whole module is on one screen and Next moves to
// the next module. One question per screen meant ~210 taps per interview before anyone had answered
// anything twice. `curMod` is a module CODE, not an index, for the same reason navigation used to be
// keyed on question names, an index into a list that gates can reshape is the bug that ate the
// enumerator's place once already.
let curMod = null;
const modList = () => CFG.mods.filter(m => CFG.q.some(q => q.m === m.c && q.t !== "hidden")).map(m => m.c);
function modPos(code){ const i = modList().indexOf(code); return i < 0 ? 0 : i }

// ---- storage. Every write is wrapped: a private window or a full disk must not throw mid-interview.
function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } }
// IST = UTC+5:30. toISOString() is always UTC; offset manually so stored timestamps are local time.
function nowIST(){ const d = new Date(), off = 5.5 * 60 * 60000; return new Date(d.getTime() + off).toISOString().replace("Z","+05:30"); }
function todayIST(){ return nowIST().slice(0,10); }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true }catch(e){ alert("STORAGE FULL / BLOCKED - export now"); return false } }
const all = () => load(KEY, []);
const pending = () => all().filter(r => !r.__exported).length;

// ---- Google Sheet sync -------------------------------------------------------------------
//
// An ADDITION to the CSV export, never a replacement for it. localStorage plus the daily export
// stays the system of record; the sheet is a second copy that appears without anybody remembering
// to make it. Everything below is written so that the worst case is "the sheet is behind", never
// "the interview is gone":
//   * nothing is ever deleted, rewritten or skipped on the strength of a sync
//   * an interview is marked sent ONLY after the server has acknowledged it by resp_id. A reply
//     lost on the way back means the row is sent again, and the Apps Script upserts on resp_id,
//     so a resend is a no-op rather than a duplicate
//   * no sync call can block, delay or fail an interview, every one is fire-and-forget off the
//     interview path, and every one is inside a try
// The route is offline for most of its length, so "concurrently" in practice means: the moment the
// tablet next has signal, without anyone doing anything.
const SKEY = "kedarnath_sync";
const DVCKEY = "kedarnath_device";
function setSite(v){
  const o = deviceCfg();
  if (v) o.site = +v; else delete o.site;
  save(DVCKEY, o);
}
function setEnum(v){
  const o = deviceCfg();
  o.enum = String(v || "");
  save(DVCKEY, o);
}
function deviceCfg(){
  let o = load(DVCKEY, {});
  if (!o.id){
    const a = new Uint8Array(4);
    try { (self.crypto || self.msCrypto).getRandomValues(a) } catch(e){ a[0]=Math.random()*256; a[1]=Math.random()*256; a[2]=Math.random()*256; a[3]=Math.random()*256; }
    o.id = "DEV-" + Array.from(a).map(b => b.toString(16).padStart(2,"0")).join("").toUpperCase().slice(0,6);
    save(DVCKEY, o);
  }
  return o;
}
// Baked build-time address (may be empty) overridden by whatever this tablet was given. Per-device
// wins: a tablet pointed at a test sheet during training must not silently revert on the next
// rebuild.
// The sheet address and token are fixed in the build (sync_config.json). There is no on-tablet
// setting for them: every tablet sends to the same sheet, automatically.
function syncCfg(){
  return { url: String((CFG.sync && CFG.sync.url) || "").trim(),
           token: String((CFG.sync && CFG.sync.token) || "").trim() };
}
const unsynced = () => all().filter(r => !r.__synced).length;

let syncing = false;

// resp_id is the upsert key, so it has to exist before the first POST and never change afterwards.
// It used to be minted inside exportCsv() from Date.now() plus the row's position in the list,
// which is unique within one tablet and nowhere near unique across four of them, two enumerators
// finishing in the same millisecond produced the same id, and on a shared sheet that is one
// interview overwriting another. crypto gives nine digits that do not depend on the clock.
function newId(){
  // crypto is the right source and is present everywhere this form runs, but it is reached through
  // a try and a Math.random fallback all the same: this is called from start(), and a throw here
  // would stop an interview beginning at all. A slightly weaker id is a trade worth making when
  // the alternative is a tablet that cannot open a new form.
  let n;
  try {
    const a = new Uint32Array(2);
    (self.crypto || self.msCrypto).getRandomValues(a);
    n = (a[0] ^ (a[1] << 7)) >>> 0;
  } catch(e){ n = Math.floor(Math.random() * 4294967296) }
  return String(100000000 + n % 900000000);
}

// One interview -> one POST. Sent twice over: once as the words the respondent actually chose, once
// as the codes, so the sheet is readable AND analysable from a single round trip.
async function pushOne(r){
  const c = syncCfg();
  if (!c.url) return false;
  const words = {}, codes = {};
  CFG.cols.forEach(k => {
    const v = r[k];
    const raw = v === undefined || v === null ? "" : String(v);
    codes[k] = raw;
    words[k] = raw === "" ? "" : String(labelOf(k, v));
  });
  // text/plain keeps this a "simple" request, so the browser sends it without a CORS preflight --
  // Apps Script does not answer OPTIONS, and a preflight would fail every time. Apps Script reads
  // the body as text regardless of what this header claims.
  const res = await fetch(c.url, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({ token: c.token, build: CFG.build,
                           row: { resp_id: r.resp_id, start: r.__start || "", end: r.__end || "",
                                  duration_min: durMin(r), words, codes } })
  });
  if (!res.ok) return false;
  let out = null;
  try { out = JSON.parse(await res.text()) } catch(e){ return false }
  // An unreadable or unhappy reply is treated as "not sent". That is the safe direction: the cost
  // is one duplicate POST, which the server absorbs.
  return !!(out && out.ok);
}

async function syncPending(manual){
  if (syncing) return;
  const c = syncCfg();
  if (!c.url){ if (manual) alert(t("syncoff")); return }
  if (navigator.onLine === false){ if (manual) alert(t("syncnet")); return }
  if (!unsynced()){ if (manual) alert(t("syncok")); return }
  syncing = true; paint();
  let sent = 0, stuck = null;
  try {
    // Snapshot the ids, not the records: finish() can add an interview while this is awaiting, and
    // iterating a live list would either miss it or iterate off the end.
    const ids = all().filter(r => !r.__synced).map(r => r.resp_id).filter(Boolean);
    for (const id of ids){
      const now = all(), r = now.find(x => x.resp_id === id);
      if (!r || r.__synced) continue;
      let ok = false;
      try { ok = await pushOne(r) } catch(e){ ok = false }
      if (!ok){ stuck = id; break }      // stop at the first failure: the rest will fail too
      // Re-read before marking. The list on disk may have grown since the push started, and
      // writing back a stale copy would drop any interview finished in between.
      const fresh = all(), hit = fresh.find(x => x.resp_id === id);
      if (hit){ hit.__synced = nowIST(); save(KEY, fresh) }
      sent++;
    }
  } finally {
    syncing = false; paint();
  }
  if (manual) alert(stuck ? (t("syncfail") + ", " + sent + " " + t("syncsent") + ", " + unsynced() + " " + t("nsync"))
                          : (sent + " " + t("syncsent")));
}

// Three triggers, because each one covers a gap the others leave: the end of an interview (the
// common case, if there happens to be signal), the moment the radio comes back (walking into
// Gaurikund at the end of the day), and a slow tick for everything else.
window.addEventListener("online", () => syncPending());
setInterval(() => syncPending(), 120000);

  if (e){ e.textContent = p + " " + t("pendbadge"); e.className = p > 5 ? "hot" : ""; }

  const b = document.getElementById("bld");
  if (b) b.textContent = "";
  // The sheet badge is HIDDEN when no address is configured, rather than shown as zero. A green
  // "0" on a tablet that is not pointed at anything reads as "all safe" and means the opposite.
  const sy = document.getElementById("sync"), u = unsynced();
  if (sy){
    if (!syncCfg().url){ sy.className = "off"; sy.textContent = "" }
    else if (syncing){ sy.className = ""; sy.textContent = t("syncing") }
    else if (u){ sy.className = "hot"; sy.textContent = u + " " + t("nsync") }
    else { sy.className = "ok"; sy.textContent = "✓ " + t("syncok") }
  }
  const s2 = document.getElementById("nsync2");
  if (s2) s2.textContent = u;
}

// ---- the values a relevance expression can see
const V = n => { const v = D[n]; return v === undefined || v === "" ? null : (isNaN(v) ? v : +v) };
// A constraint that names another field needs that field as a NUMBER. An unanswered one must not
// make the constraint fail, treat it as no limit rather than as zero.
const NUM = n => { const v = +D[n]; return isNaN(v) ? Infinity : v };
const SEL = n => (D[n] || "").toString().trim() === "" ? [] : D[n].toString().trim().split(/\s+/);
function calc(){                            // the two hidden calculates the XLSForm also builds
  let nw = 0, ow = 0;
  for (let m = 1; m <= 12; m++){ const s = +D["status_m" + m]; if (s === 8) nw++; if (s >= 2 && s <= 7) ow++ }
  D.calc_months_no_work = nw; D.calc_offseason_work = ow;
}
function visible(q){
  if (!q.rel) return true;
  calc();
  try { return !!eval(q.rel) } catch(e){ return true }   // a broken rule must SHOW the question, never hide it
}
function rebuild(){ shown = CFG.q.filter(visible) }

// ---- rendering: one MODULE per screen ---------------------------------------------------------
// Every question in the module is written into the DOM, including ones a gate currently hides --
// those get `hidden` and are toggled by applyGates() on each keystroke. Hiding with a class rather
// than re-rendering is deliberate: re-rendering the module on every input would throw away focus and
// the caret mid-number, which is precisely the "input is buggy" defect that was fixed once already.
function qBlock(q){
  if (q.t === "hidden") return "";
  const v = D[q.n] ?? "";
  let h = "<div class=card data-q='" + q.n + "'>";
  // The consent script is rendered ON the consent question, not as a module preamble. It is the one
  // block in this form that must be read word for word, so it is marked as such and styled unlike
  // both the question and the enumerator hint, which says the opposite, do not read out.
  if (q.n === "consent"){
    h += "<div class=consent><span class=lead>" + t("verbatim") + "</span>" +
         t("cons").split("\n\n").map(x => "<p>" + x + "</p>").join("") + "</div>";
  }
  h += "<div class=qt>" + (L ? q.en : q.hi) + "</div>";
  if (q.hn) h += "<div class=hint><b>" + t("foryou") + "</b>" + (L ? q.hn : q.hnh) + "</div>";
  if (q.t === "one" || q.t === "multi"){
    const sel = q.t === "multi" ? SEL(q.n) : [String(v)];
    const drop = q.cfx ? String(D[q.cfx] ?? "") : "";
    const only = q.cfo ? SEL(q.cfo) : null;
    let opts = q.c;
    if (drop) opts = opts.filter(c => String(c[0]) !== drop);
    if (only) opts = opts.filter(c => only.includes(String(c[0])));
    // A long single-choice list is drawn as a dropdown instead of a column of radio buttons. At 35
    // options the radio form runs to roughly four phone screens, so picking a state means scrolling
    // past the question, losing it, and scrolling back, and every later question on the module
    // screen is pushed down behind it. `dd` is set by the builder from the length of the choice
    // list, never by hand, so no list can quietly grow past the threshold and stay a radio column.
    if (q.dd && q.t === "one"){
      h += "<select class=dd name='q_" + q.n + "'><option value=''>" + (L ? "— select —" : "— चुनें —") + "</option>";
      opts.forEach(c => {
        h += "<option value='" + c[0] + "'" + (sel.includes(String(c[0])) ? " selected" : "") + ">" +
             (L ? c[1] : c[2]) + "</option>";
      });
      h += "</select>";
    } else {
    opts.forEach(c => {
      const on = sel.includes(String(c[0]));
      h += "<label class='ch" + (on ? " on" : "") + "'><input type=" + (q.t === "multi" ? "checkbox" : "radio") +
           " name='q_" + q.n + "' value='" + c[0] + "'" + (on ? " checked" : "") + "><span>" +
           (L ? c[1] : c[2]) + "</span></label>";
    });
    }
  } else if (q.t === "text"){
    h += "<input type=text value=\"" + String(v).replace(/"/g,"&quot;") + "\">";
  } else {
    h += "<input type=number inputmode=" + (q.t === "int" ? "numeric" : "decimal") +
         (q.t === "dec" ? " step=any" : "") + " value='" + v + "'>";
  }
  if (q.opt) h += "<div class=opt>" + t("opt") + "</div>";
  h += "<div class=err></div></div>";
  return h;
}

// Clearing answers that a gate has closed is not tidiness, it is correctness. A module shows all its
// questions at once, so this sequence is ordinary: answer origin = "other state", answer "why did you
// first come here", then correct origin to "local". The reason question disappears, and used to keep
// its answer, which then went into the export and broke the skip-logic asserts on a fact the
// respondent never asserted. Kobo and ODK drop irrelevant answers at submission; this matches them.
function clearHidden(){
  let changed = false;
  CFG.q.forEach(q => {
    if (!visible(q) && D[q.n] !== undefined && D[q.n] !== ""){ delete D[q.n]; changed = true }
  });
  if (changed) save(DKEY, D);
  return changed;
}

// Rebuild the option list of a question whose choices depend on another answer. This has to happen
// as answers land, not only at render: the whole module is on one screen, so `occupation` is answered
// on the SAME screen as other_activity_types, and a list built once at render still carried the
// primary occupation through the entire pass. It only ever looked fixed because leaving the module
// and coming back re-rendered it.
// Only the dependent question's own card is rewritten, never the one being typed into, so nothing
// loses focus or the caret.
// Drop an answer that its own filter has made unavailable, say the enumerator ticks an activity as
// a second occupation and then names that same activity as the primary one. Done over CFG.q from the
// DATA, not by walking the DOM: a card for a module the enumerator has not opened does not exist, and
// pruning that depended on the card existing would leave the stale answer in the export. Same lesson
// as next() deciding from data rather than from the rendered page.
function pruneFiltered(){
  CFG.q.forEach(q => {
    if (!q.cfx && !q.cfo) return;
    const drop = q.cfx ? String(D[q.cfx] ?? "") : "";
    const only = q.cfo ? SEL(q.cfo) : null;
    let opts = q.c;
    if (drop) opts = opts.filter(c => String(c[0]) !== drop);
    if (only) opts = opts.filter(c => only.includes(String(c[0])));
    const avail = opts.map(c => String(c[0]));
    if (q.t === "multi"){
      const keep = SEL(q.n).filter(v => avail.includes(v));
      if (keep.join(" ") !== String(D[q.n] ?? "")){ D[q.n] = keep.join(" "); save(DKEY, D) }
    } else if (D[q.n] !== undefined && D[q.n] !== "" && !avail.includes(String(D[q.n]))){
      delete D[q.n]; save(DKEY, D);
    }
  });
}

function refilter(){
  document.querySelectorAll("#app .card[data-q]").forEach(card => {
    const q = QBY[card.dataset.q];
    if (!q || (!q.cfx && !q.cfo)) return;
    // refilter() works by removing label.ch rows and re-inserting them. A dropdown has none, so it
    // would strip nothing, insert radio rows beside the select, and leave two controls writing to
    // one answer. No dropdown question is choice-filtered today; this guard is here so that pairing
    // the two in future fails visibly rather than by quietly growing a second control.
    if (q.dd && q.t === "one") return;
    const key = (q.cfx ? String(D[q.cfx] ?? "") : "") + "|" + (q.cfo ? String(D[q.cfo] ?? "") : "");
    if (card.dataset.filterKey === key) return;          // source unchanged; leave the DOM alone
    card.dataset.filterKey = key;
    const drop = q.cfx ? String(D[q.cfx] ?? "") : "";
    const only = q.cfo ? SEL(q.cfo) : null;
    let opts = q.c;
    if (drop) opts = opts.filter(c => String(c[0]) !== drop);
    if (only) opts = opts.filter(c => only.includes(String(c[0])));
    const sel = q.t === "multi" ? SEL(q.n) : [String(D[q.n] ?? "")];
    let h = "";
    opts.forEach(c => {
      const on = sel.includes(String(c[0]));
      h += "<label class='ch" + (on ? " on" : "") + "'><input type=" + (q.t === "multi" ? "checkbox" : "radio") +
           " name='q_" + q.n + "' value='" + c[0] + "'" + (on ? " checked" : "") + "><span>" +
           (L ? c[1] : c[2]) + "</span></label>";
    });
    card.querySelectorAll("label.ch").forEach(n => n.remove());
    const err = card.querySelector(".err");
    if (err) err.insertAdjacentHTML("beforebegin", h);
    bindCard(card, q);
  });
}

// Attach the write-on-every-change handler. Called from render() and again from refilter() whenever a
// list is rebuilt, since replacing the inputs drops their listeners with them.
function bindCard(card, q){
  if (!q) return;
  // "input, select" and not just "input": a dropdown question has no <input> at all, so binding
  // only inputs left the select writing to nothing -- the enumerator picks a state, the form shows
  // it picked, and the answer never reaches D. Select fires both input and change; one listener on
  // "input" is enough and keeps the handler below identical for both control types.
  card.querySelectorAll("input, select").forEach(el => {
    if (el.dataset.bound) return;
    el.dataset.bound = "1";
    el.addEventListener("input", () => {
      if (q.t === "multi"){
        D[q.n] = [...card.querySelectorAll("input:checked")].map(x => x.value).sort((a,b)=>a-b).join(" ");
      } else { D[q.n] = el.value }
      save(DKEY, D);
      card.querySelectorAll("label.ch").forEach(lb => lb.classList.toggle("on", lb.querySelector("input").checked));
      const e = card.querySelector(".err"); if (e) e.textContent = "";
      applyGates();
    });
  });
}

function applyGates(){
  calc();
  clearHidden();
  pruneFiltered();
  refilter();
  let n = 0;

function validate(q){
  const v = D[q.n];
  const blank = v === undefined || v === null || String(v).trim() === "";
  if (blank) return q.opt ? null : t("req");
  if (q.con){
    const x = +v;                      // numeric constraints read x
    const SELF = SEL(q.n);             // multi-select constraints read the code list
    try { if (!eval(q.con)) return L ? q.cmsg_en : q.cmsg_hi } catch(e){}
  }
  return null;
}

// Validate every question the module is currently SHOWING. A hidden question is not the enumerator's
// problem and must never block the screen, that is how a gated-off required field used to trap the
// interview with no visible error to fix.
// The decision is computed from DATA, not by reading the DOM. That keeps next() exercisable by the
// headless harness in checks/08, which has no real document, and a validation path the tests cannot
// reach is one that breaks silently.
function moduleErrors(){
  return CFG.q.filter(q => q.m === curMod && visible(q))
              .map(q => [q, validate(q)]).filter(p => p[1]);
}
function showErrors(errs){
  const byName = Object.fromEntries(errs.map(p => [p[0].n, p[1]]));
  let first = null;
  document.querySelectorAll("#app .card[data-q]").forEach(card => {
    const e = byName[card.dataset.q] || "";
    const slot = card.querySelector(".err");
    if (slot) slot.textContent = e;
    card.classList.toggle("bad", !!e);
    if (e && !first) first = card;
  });
  if (first && first.scrollIntoView) first.scrollIntoView({block:"center"});
}
function next(){
  const errs = moduleErrors();
  showErrors(errs);
  if (errs.length) return;
  if (curMod === "P" && String(D.consent) === "0") return finish(true);
  const mods = modList(), here = modPos(curMod);
  if (here + 1 >= mods.length) return finish();
  curMod = mods[here + 1];
  render();
}
function back(){
  const mods = modList(), here = modPos(curMod);

}

// Precise location. Asked for as soon as the form opens, not when an interview starts, so the fix
// is ready by the time anyone is approached. The most accurate fix seen is kept (not the first),
// to six decimal places, with its accuracy and how long it took. Refreshes for up to two minutes,
// stopping early at 15 metres or better. Never blocks anything.
let gpsBest = null, gpsErr = null, gpsT0 = Date.now(), gpsWatch = null, gpsTimer = null;
function gpsStop(){
  if (gpsWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch = null;
  clearTimeout(gpsTimer);
}
// Copy the best fix onto the record being filled in, if there is one.
function gpsApply(){
  if (!D || !D.resp_id) return;
  if (gpsBest){
    D.gps_lat = gpsBest.lat; D.gps_lon = gpsBest.lon;
    D.gps_accuracy_m = String(gpsBest.acc); D.gps_fix_s = String(gpsBest.s);
    if (gpsBest.acc > 200) D.gps_error = "3"; else delete D.gps_error;
  } else if (gpsErr){
    D.gps_error = gpsErr;
  }
  save(DKEY, D);
}
function gpsOpen(){
  if (!navigator.geolocation){ gpsErr = "2"; gpsApply(); return }
  gpsWatch = navigator.geolocation.watchPosition(p => {
    const acc = Math.round(p.coords.accuracy);
    if (!gpsBest || acc < gpsBest.acc){
      gpsBest = { lat: p.coords.latitude.toFixed(6), lon: p.coords.longitude.toFixed(6),
                  acc: acc, s: Math.round((Date.now() - gpsT0) / 1000) };
      gpsErr = null;
      gpsApply();
    }
    if (acc <= 15) gpsStop();
  }, err => {
    if (!gpsBest){
      gpsErr = err.code === 1 ? "1" : "2";
      gpsApply();
      if (err.code === 1) alert(L
        ? "Location is blocked for this site. Allow it in the browser's site settings. The interview can go on without it."
        : "इस साइट के लिए स्थान बंद है। ब्राउज़र की साइट सेटिंग्स में इसे चालू करें। साक्षात्कार उसके बिना भी जारी रह सकता है।");
    }
  }, {enableHighAccuracy: true, maximumAge: 0, timeout: 30000});
  gpsTimer = setTimeout(gpsStop, 120000);
}
// A new record gets a fresh fix: the device may have moved since the last interview.
function gpsRestart(){
  gpsStop();
  gpsBest = null; gpsErr = null; gpsT0 = Date.now();
  gpsOpen();
}

// ---- export. Two files, one row per interview, same resp_id in both:
//   LIV_codes_*.csv  the numeric codes, one column per variable, the layout the Stata build reads
//   LIV_text_*.csv   the same columns as the respondent's own words (option text, verbatim answers)
// Same column names in both, so either file joins to the other on resp_id.
function csvCell(s){ s = s === undefined || s === null ? "" : String(s);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s }
// Code -> the option text that was actually chosen. Multi-selects are stored as space-separated
// codes, so each one is mapped and the labels rejoined with "; ", a semicolon, not a comma, so a
// labelled multi-select never needs quoting and can never be mistaken for a column break.
function labelOf(col, v){
  const m = CFG.labs[col];
  if (!m || v === undefined || v === null || String(v).trim() === "") return v;
  return String(v).trim().split(/\s+/).map(x => (m[x] ? (L ? m[x].e : m[x].h) : x)).join("; ");
}
function durMin(r){
  const a = Date.parse(r.__start || ""), b = Date.parse(r.__end || "");
  if (!a || !b || b < a) return "";
  return Math.round((b - a) / 60000);
}
function csvText(kind, rows){
  const header = ["resp_id", "start", "end", "duration_min"].concat(CFG.cols);
  let out = header.map(csvCell).join(",") + "\n";
  rows.forEach(r => {
    const row = [r.resp_id, r.__start || "", r.__end || "", durMin(r)];
    CFG.cols.forEach(c => row.push(csvCell(kind === "text" ? labelOf(c, r[c]) : (r[c] ?? ""))));
    out += row.join(",") + "\n";
  });
  return out;
}
function saveCsv(name, text){
  const blob = new Blob(["\ufeff" + text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(){
  const rows = all();
  if (!rows.length) return alert(t("nodata"));
  // Ids are fixed before either file is written, so the two files always agree on resp_id.
  rows.forEach(r => { r.resp_id = r.resp_id || newId(); r.form_build = r.form_build || CFG.build; });
  rows.forEach(r => r.__exported = true); save(KEY, rows);
  const _ts = nowIST().slice(0,19).replace("T","_").replace(/:/g,"-");
  saveCsv("LIV_codes_" + _ts + ".csv", csvText("codes", rows));
  // A second download straight after the first can be held by the browser's multiple-download
  // prompt; the short delay lets the first finish so the prompt is less likely.
  setTimeout(() => saveCsv("LIV_text_" + _ts + ".csv", csvText("text", rows)), 400);
  paint();
}

// The address is entered on the tablet rather than only baked into the build, so a sheet can be
// changed, or a training sheet swapped for the real one, without rebuilding and redeploying the
// form to four devices over a connection that may not exist.
// A GET health check, so the address can be proved right at the hotel the night before rather than
// discovered wrong at the end of a day's interviews.
function clearExported(){
  const keep = all().filter(r => !r.__exported);
  const gone = all().length - keep.length;
  if (!gone) return alert(t("nodata"));
  // Deletion is gated on BOTH copies, not just the CSV. The sheet was added as a second safety
  // net, and a net that can be cut by the button meant to be safe is not one, an interview
  // exported to a CSV that is still only on the same tablet, then cleared, has one copy left.
  const risky = all().filter(r => r.__exported && !r.__synced).length;
  if (risky && syncCfg().url &&
      !confirm(risky + " of them have NOT reached the Google Sheet yet. Delete anyway?")) return;
  if (!confirm(gone + " exported interviews will be deleted from this device.")) return;
  save(KEY, keep); menu();
}

// ---- offline support. Without this the form must be fetched from the network every time it is
// opened, which on this route means it does not open at all. The worker caches the whole app on
// first visit; afterwards the tablet needs no connectivity to start an interview.
//
// Updates are deliberately NOT applied automatically: swapping the form out mid-interview would be
// worse than running a version behind. A new build installs and waits, a banner appears, and it
// takes effect the next time the form is fully closed and reopened.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) {
          const b = document.getElementById("upd");
          b.textContent = L ? "A new version of the form is ready. Close it completely and reopen."
                             : "फ़ॉर्म का नया रूप तैयार है। इसे पूरी तरह बंद करके दोबारा खोलें।";
          b.style.display = "block";
        }
      });
    });
  }).catch(() => {});   // an unsupported browser must still run the form, just without offline
}

const draft = load(DKEY, null);
if (draft && Object.keys(draft).length > 2) showResume(draft);
else menu();
</script>
