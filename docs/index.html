<!doctype html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<!-- Stop the browser offering to translate. A Hindi form auto-translated to English turns
     "पक्का" (permanent) into "Sure!" and "जमा पैसे से" (used savings) into "from the deposited
     money" -- the reviewer then critiques wording that was never in the instrument. All three
     signals are needed: Chrome honours the meta, Safari and Edge honour the attribute, and the
     class covers dynamically inserted text. -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kedarnath Yatra Worker Survey</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kedarnath Survey">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--mut:#666e7a;--line:#d9dde3;--acc:#1f6feb;--warn:#b42318;--ok:#067647}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 system-ui,"Segoe UI",Roboto,"Nirmala UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:15px}.grow{flex:1}
button{font:inherit;padding:10px 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45}
#pend{font-size:13px;padding:4px 9px;border-radius:99px;background:#eef1f5;color:var(--mut)}
#pend.hot{background:#fee4e2;color:var(--warn);font-weight:600}
main{max-width:680px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}
.qn{font-size:12px;color:var(--mut);letter-spacing:.04em}
.qt{margin:6px 0 12px;font-size:17px}
input[type=text],input[type=number]{width:100%;padding:13px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
label.ch{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:8px;margin:0 0 7px;background:#fff}
label.ch.on{border-color:var(--acc);background:#eff5ff}
label.ch input{margin:3px 0 0}
.err{color:var(--warn);font-size:14px;margin-top:7px}
.opt{font-size:12px;color:var(--mut);margin-top:6px}
/* Enumerator hint: how to CODE this question, never read to the respondent. Amber and rule-marked so
   it is visibly a different kind of thing from the question above it and from the read-aloud intro,
   which is blue. Three kinds of text on one screen need three unmistakable looks. */
.hint{background:#fff8e6;border-left:4px solid #b78103;border-radius:0 6px 6px 0;padding:9px 11px;margin:0 0 11px;font-size:13.5px;color:#5c4708}
.hint b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:#8a6200}
h2{font-size:15px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
/* Read-aloud module introduction. Deliberately styled unlike a question card -- tinted, ruled down
   the side, italic lead-in -- so an enumerator glancing at the screen can never mistake it for
   something the respondent is meant to answer. */
.intro{background:#eff5ff;border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:12px 14px;margin:0 0 12px;font-size:15px}
.intro .lead{display:block;font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;max-width:680px;margin:0 auto}
footer button{flex:1}
.mid{text-align:center;padding:40px 16px;color:var(--mut)}
#upd{display:none;background:#fef0c7;border-bottom:1px solid #f5c344;color:#7a5b00;padding:9px 14px;font-size:14px;text-align:center}
.big{font-size:20px;color:var(--ink);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 4px;border-bottom:1px solid var(--line)}
</style></head>

<script>
const CFG = {"q":[{"n":"enum_id","m":"P","t":"one","en":"Which enumerator is doing this interview? (Select your own name before you approach anyone.)","hi":"सर्वेक्षक कौन है?","opt":false,"c":[[1,"Raman","रमन"],[2,"Rishit","ऋषित"],[3,"Tanmay","तन्मय"],[4,"Anuj","अनुज"]]},{"n":"consent","m":"P","t":"one","en":"Read the consent script. Do you agree to take part? (1 yes, 0 no; stop if no)","hi":"क्या आप इस बातचीत में शामिल होना चाहते हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"age","m":"A","t":"dec","en":"How old are you? (completed years)","hi":"आपकी उम्र कितनी है? (पूरे साल)","opt":false,"con":"x >= 10 && x <= 90","cmsg_en":"Age must be between 10 and 90.","cmsg_hi":"उम्र 10 से 90 के बीच होनी चाहिए।"},{"n":"female","m":"A","t":"one","en":"Record sex; ask if unsure: are you male or female?","hi":"आप पुरुष हैं या महिला?","opt":false,"c":[[0,"Male","पुरुष"],[1,"Female","महिला"]]},{"n":"hoh_relation","m":"A","t":"one","en":"Who is the head of your household -- is it you, or someone else? If someone else, how are they related to you?","hi":"आपके घर का मुखिया कौन है — आप खुद, या कोई और? अगर कोई और है, तो वे आपके क्या लगते हैं?","opt":false,"c":[[1,"Self (respondent is the head)","मैं खुद मुखिया हूँ"],[2,"Husband","पति"],[3,"Wife","पत्नी"],[4,"Father","पिता"],[5,"Mother","माता"],[6,"Son","बेटा"],[7,"Daughter","बेटी"],[8,"Brother","भाई"],[9,"Sister","बहन"],[10,"Other male relative","कोई और पुरुष रिश्तेदार"],[11,"Other female relative","कोई और महिला रिश्तेदार"],[12,"Other, non-relative (male)","रिश्तेदार नहीं, पुरुष"],[13,"Other, non-relative (female)","रिश्तेदार नहीं, महिला"]]},{"n":"native_language","m":"A","t":"one","en":"What is your native language, the language you first learned at home?","hi":"आपकी मातृभाषा कौन सी है — वह भाषा जो आपने घर में सबसे पहले सीखी?","opt":false,"c":[[1,"Garhwali","गढ़वाली"],[2,"Kumaoni","कुमाऊँनी"],[3,"Hindi","हिंदी"],[4,"Nepali","नेपाली"],[5,"Bhojpuri","भोजपुरी"],[6,"Assamese","असमिया"],[7,"Bengali","बांग्ला"],[8,"Bodo","बोडो"],[9,"Dogri","डोगरी"],[10,"Gujarati","गुजराती"],[11,"Kannada","कन्नड़"],[12,"Kashmiri","कश्मीरी"],[13,"Konkani","कोंकणी"],[14,"Maithili","मैथिली"],[15,"Malayalam","मलयालम"],[16,"Manipuri (Meitei)","मणिपुरी (मैतेई)"],[17,"Marathi","मराठी"],[18,"Odia","ओड़िया"],[19,"Punjabi","पंजाबी"],[20,"Sanskrit","संस्कृत"],[21,"Santali","संताली"],[22,"Sindhi","सिंधी"],[23,"Tamil","तमिल"],[24,"Telugu","तेलुगु"],[25,"Urdu","उर्दू"],[96,"Other Indian language","कोई और भारतीय भाषा"],[97,"Other / foreign language","कोई और / विदेशी भाषा"]]},{"n":"native_language_other","m":"A","t":"text","en":"Which language is it? Write down exactly what they say.","hi":"वह कौन सी भाषा है? जैसा वे कहें वैसा ही लिख लीजिए।","opt":false,"rel":"V('native_language') == 96 || V('native_language') == 97"},{"n":"marital_status","m":"A","t":"one","en":"Are you currently married, never married, or widowed/divorced/separated?","hi":"क्या आपकी शादी हुई है, नहीं हुई है, या आप विधवा/विधुर या अलग हैं?","opt":false,"c":[[1,"Currently married","शादीशुदा"],[2,"Never married","शादी नहीं हुई"],[3,"Widowed/divorced/separated","विधवा/विधुर या अलग"]]},{"n":"knows_years_schooling","m":"A","t":"one","en":"Do you know exactly how many years of schooling you completed, counting from class 1?","hi":"क्या आपको ठीक-ठीक याद है कि आपने कितने साल पढ़ाई की, कक्षा 1 से गिनकर?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"years_schooling","m":"A","t":"int","en":"How many years of schooling did you complete in total? (0 if none)","hi":"आपने कुल कितने साल पढ़ाई की? (अगर बिल्कुल नहीं पढ़े तो 0)","opt":false,"rel":"V('knows_years_schooling') == 1"},{"n":"education_level_cat","m":"A","t":"one","en":"Which is closest: no formal education; some schooling but did not finish primary; finished primary but not secondary; or finished secondary or higher?","hi":"इनमें से कौन सा सबसे नज़दीक है: बिल्कुल नहीं पढ़े; थोड़ा पढ़े पर प्राइमरी पूरी नहीं की; प्राइमरी पूरी की पर दसवीं नहीं; या दसवीं या उससे ज़्यादा?","opt":false,"c":[[1,"No formal education","बिल्कुल नहीं पढ़े"],[2,"Some schooling, did not complete primary","थोड़ा पढ़े, प्राइमरी पूरी नहीं"],[3,"Completed primary but not secondary","प्राइमरी पूरी, दसवीं नहीं"],[4,"Completed secondary or higher","दसवीं या उससे ज़्यादा"],[98,"Prefer not to say","बताना नहीं चाहते"]],"rel":"V('knows_years_schooling') == 0"},{"n":"hhsize","m":"A","t":"int","en":"How many members live in your household, including you?","hi":"आपके घर में आपको मिलाकर कुल कितने लोग रहते हैं?","opt":false,"con":"x >= 1 && x <= 30","cmsg_en":"Household size must be between 1 and 30.","cmsg_hi":"घर के लोग 1 से 30 के बीच होने चाहिए।"},{"n":"any_member_6yr_schooling","m":"A","t":"one","en":"Counting everyone in your household aged 10 or above, has at least one of them finished six years of schooling or more?","hi":"आपके घर में 10 साल या उससे बड़े सभी लोगों में से, क्या कम से कम एक ने छह साल या उससे ज़्यादा पढ़ाई पूरी की है?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"family_structure","m":"A","t":"one","en":"Is your family nuclear -- just you, your spouse and unmarried children -- or joint, living with parents, married siblings or other extended family? (Say single-member if you live alone.)","hi":"आपका परिवार छोटा है — सिर्फ़ आप, पति/पत्नी और बिन ब्याहे बच्चे — या बड़ा, यानी माँ-बाप, भाई-भाभी या और रिश्तेदार साथ रहते हैं? (अगर अकेले रहते हैं तो वह बताइए।)","opt":false,"c":[[1,"Nuclear (you, spouse and unmarried children only)","छोटा परिवार (आप, पति/पत्नी और बिन ब्याहे बच्चे)"],[2,"Joint (living with parents, married siblings or other extended family)","बड़ा परिवार (माँ-बाप, ब्याहे भाई-बहन या और रिश्तेदार साथ)"],[3,"Single-member household","अकेले रहते हैं"]]},{"n":"n_earners","m":"A","t":"int","en":"How many of them, including you, earn money?","hi":"इनमें से कितने लोग, आपको मिलाकर, पैसा कमाते हैं?","opt":false,"con":"x >= 1 && x <= NUM('hhsize')","cmsg_en":"Cannot be more than the number of people in the household.","cmsg_hi":"घर के लोगों की संख्या से ज़्यादा नहीं हो सकता।"},{"n":"main_income_earner","m":"A","t":"one","en":"Among those who earn money, are you the main income earner in your household?","hi":"जो लोग कमाते हैं, उनमें सबसे ज़्यादा कमाने वाले आप ही हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]],"rel":"V('n_earners') > 1"},{"n":"n_children_u15","m":"A","t":"int","en":"How many of them are children under 15?","hi":"इनमें 15 साल से छोटे बच्चे कितने हैं?","opt":false,"con":"x >= 0 && x <= NUM('hhsize') - 1","cmsg_en":"Cannot be more than the household size minus the respondent.","cmsg_hi":"घर के लोगों में से आपको छोड़कर, उससे ज़्यादा नहीं हो सकता।"},{"n":"n_children_6_14","m":"A","t":"int","en":"How many of them are children aged 6 to 14?","hi":"इनमें 6 से 14 साल के बच्चे कितने हैं?","opt":false,"con":"x >= 0 && x <= NUM('n_children_u15')","cmsg_en":"Cannot be more than the number of children under 15.","cmsg_hi":"15 साल से छोटे बच्चों से ज़्यादा नहीं हो सकता।"},{"n":"n_children_out_school","m":"A","t":"int","en":"How many of these children do not go to school now?","hi":"इन बच्चों में कितने अभी स्कूल नहीं जाते?","opt":false,"rel":"V('n_children_6_14') > 0","con":"x >= 0 && x <= NUM('n_children_6_14')","cmsg_en":"Cannot be more than the number of children aged 6 to 14.","cmsg_hi":"6 से 14 साल के बच्चों से ज़्यादा नहीं हो सकता।"},{"n":"occupation","m":"B","t":"one","en":"What is your main work during the Yatra season? Ask what they do and code the closest group; do not read the list aloud unless needed.","hi":"यात्रा के मौसम में आपका मुख्य काम क्या है?","opt":false,"c":[[1,"Pony/mule worker (works the animals, does not own them)","घोड़े/खच्चर वाला (जानवर चलाते हैं, मालिक नहीं)"],[2,"Pony/mule owner (owns the animals)","घोड़े/खच्चर का मालिक"],[3,"Porter (carries on own back/shoulders - goods, luggage, or a person in a kandi)","पोर्टर/कुली (अपनी पीठ या कंधे पर — सामान या कंडी में कोई व्यक्ति)"],[4,"Palki / dandi bearer (carries a person on a palanquin, as part of a team)","पालकी / डंडी वाला (पालकी पर व्यक्ति, कई लोग मिलकर)"],[5,"Dhaba, tea stall or food stall WORKER (prepared food or tea)","ढाबा, चाय या खाने की दुकान में काम (बना हुआ खाना या चाय)"],[6,"Dhaba, tea stall or food stall OWNER (prepared food or tea)","ढाबा, चाय या खाने की दुकान का मालिक"],[7,"Shop WORKER (goods: prasad, puja items, clothes, general store)","दुकान में काम (सामान: प्रसाद, पूजा का सामान, कपड़े, परचून)"],[8,"Shop OWNER (goods, not prepared food)","दुकान का मालिक (सामान, बना हुआ खाना नहीं)"],[9,"Hotel / lodge WORKER","होटल / लॉज में काम"],[10,"Hotel / lodge OWNER","होटल / लॉज का मालिक"],[11,"Driver (any motor vehicle)","ड्राइवर (कोई भी गाड़ी)"],[12,"Guide","गाइड"],[13,"Wage labourer (construction, loading, odd jobs)","दिहाड़ी मज़दूर (निर्माण, सामान चढ़ाना, फुटकर काम)"],[14,"Other","कोई और"]]},{"n":"occupation_detail","m":"B","t":"text","en":"In your own words, what exactly is your main work here? Write down what they say -- what they actually do, and who for. Do not tick a box for this one.","hi":"अपने शब्दों में बताइए, यहाँ आपका मुख्य काम ठीक-ठीक क्या है? आप करते क्या हैं, और किसके लिए?","opt":false},{"n":"employment_type","m":"B","t":"one","en":"In this main work, are you: working on your own account without hired workers; running a business with hired workers; a regular monthly wage-earner; or a daily/casual wage-earner?","hi":"इस काम में आप क्या हैं: अपना काम खुद करते हैं और कोई नौकर नहीं रखते; अपना काम है और दूसरों को काम पर रखते हैं; महीने की पक्की तनख़्वाह पाते हैं; या दिहाड़ी पर काम करते हैं?","opt":false,"c":[[1,"Own-account (self-employed, no hired workers)","अपना काम, कोई नौकर नहीं"],[2,"Employer/business owner (self-employed)","मालिक, दूसरों को काम पर रखते हैं"],[3,"Regular wage or salary","महीने की पक्की तनख़्वाह"],[4,"Casual wage labour","दिहाड़ी"]]},{"n":"n_other_activities","m":"B","t":"int","en":"Besides your main work, how many OTHER paid activities or income-generating activities do you have? (0 if none. For example, a shop owner who also rents out a pony and drives in the off-season woul  0 && x <= 7","cmsg_en":"Must be between 0 and 7 days.","cmsg_hi":"0 से 7 दिन के बीच होना चाहिए।"},{"n":"ropeway_stance","m":"J","t":"one","en":"A ropeway is proposed between Gaurikund and Kedarnath. Are you in favour, neutral, or against?","hi":"गौरीकुंड से केदारनाथ तक रोपवे बनाने की बात चल रही है। आप इसके पक्ष में हैं, बीच में हैं, या ख़िलाफ़ हैं?","opt":false,"c":[[1,"Support","समर्थन में"],[2,"Neutral","तटस्थ"],[3,"Oppose","विरोध में"],[98,"Prefer not to say","बताना नहीं चाहते"]]},{"n":"trek_dependent","m":"J","t":"one","en":"Is your main Yatra work carrying, transporting or guiding people or goods on the Gaurikund to Kedarnath trek?","hi":"क्या आपका मुख्य यात्रा-काम गौरीकुंड से केदारनाथ के पैदल रास्ते पर लोगों या सामान को ले जाना, पहुँचाना या रास्ता दिखाना है?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"job_situation","m":"K","t":"one","en":"Which best describes your situation during the last month: you work for pay full-time; you work for pay part-time or do occasional jobs; you study and work; you only study; you are only being trained for work; you are retired or pensioned; you do unpaid household tasks or care for others; you are unemployed and actively looking for work; you are sick or disabled and cannot work; or none of these?","hi":"पिछले महीने आपकी हालत इनमें से किससे सबसे मिलती है: पूरे समय पैसे के लिए काम; कुछ समय या कभी-कभार का काम; पढ़ाई के साथ काम; सिर्फ़ पढ़ाई; सिर्फ़ काम की ट्रेनिंग; रिटायर या पेंशन पर; घर का बिना पैसे का काम या किसी की देखभाल; काम नहीं है और ढूँढ रहे हैं; बीमारी या विकलांगता से काम नहीं कर सकते; या इनमें से कुछ नहीं?","opt":false,"c":[[1,"Works for pay full-time","पूरे समय पैसे के लिए काम"],[2,"Works for pay part-time or occasional jobs","कुछ समय या कभी-कभार का काम"],[3,"Studies and works","पढ़ाई के साथ काम"],[4,"Only studies","सिर्फ़ पढ़ाई"],[5,"Being trained for work only","सिर्फ़ काम की ट्रेनिंग"],[6,"Retired or pensioned","रिटायर या पेंशन पर"],[7,"Unpaid household tasks or caring for others","घर का बिना पैसे का काम या देखभाल"],[8,"Unemployed, actively seeking work","काम नहीं है, ढूँढ रहे हैं"],[9,"Sick or disabled, cannot work","बीमारी या विकलांगता से काम नहीं कर सकते"],[10,"Neither studying, working nor seeking work","न पढ़ाई, न काम, न ढूँढ रहे हैं"],[97,"Does not know","पता नहीं"]]},{"n":"employer_type","m":"K","t":"one","en":"In your current work, are you: an employee of a private company; an employee of the public sector or government; a member of the armed forces or law enforcement; an employer or business owner who hires others; working alone with no employees; an unpaid family worker; or a domestic service worker?","hi":"अपने अभी के काम में आप क्या हैं: किसी प्राइवेट कंपनी के कर्मचारी; सरकारी विभाग के कर्मचारी; फ़ौज या पुलिस में; मालिक जो दूसरों को काम पर रखते हैं; अकेले काम करते हैं, कोई नौकर नहीं; घर के काम में बिना पैसे के हाथ बँटाते हैं; या किसी के घर में काम करते हैं?","opt":false,"c":[[1,"Employee, private company","प्राइवेट कंपनी के कर्मचारी"],[2,"Employee, public sector/government","सरकारी विभाग के कर्मचारी"],[3,"Armed forces or law enforcement","फ़ौज या पुलिस"],[4,"Employer/business owner (hires others)","मालिक, दूसरों को रखते हैं"],[5,"Works alone, no employees","अकेले काम करते हैं"],[6,"Unpaid family worker","घर के काम में बिना पैसे के"],[7,"Domestic service worker","किसी के घर में काम"]],"rel":"V('job_situation') <= 3"},{"n":"job_permanence","m":"K","t":"one","en":"Is your job: permanent; seasonal or temporary; occasional or casual; on probation; or fixed-term?","hi":"आपका काम कैसा है: पक्का; मौसमी या कुछ समय का; कभी-कभार का; परखने की अवधि पर; या तय समय के लिए?","opt":false,"hn":"Both will sound seasonal here -- the Yatra closes for everyone. Ask about WITHIN the season. One employer keeps them on for a stretch = Seasonal or temporary. They take work day by day from whoever offers it = Occasional or casual. Self-employed: answer for how their own work runs. On probation and Fixed-term are rare here; do not reach for them.","hnh":"यहाँ दोनों ही मौसमी लगेंगे — यात्रा तो सबके लिए बंद होती है। मौसम के अंदर की बात पूछिए। एक ही मालिक कुछ समय तक रखे हुए है = मौसमी या अस्थायी। जो भी काम रोज़-रोज़ मिल जाए वह कर लेते हैं = कभी-कभार या दिहाड़ी। अपना काम करने वालों के लिए: उनका अपना काम कैसे चलता है, वह देखिए। परख पर और तय अवधि वाले यहाँ बहुत कम मिलेंगे; इन्हें यूँ ही न चुनें।","c":[[1,"Permanent","पक्का"],[2,"Seasonal or temporary","मौसमी या कुछ समय का"],[3,"Occasional or casual","कभी-कभार का"],[4,"On probation","परखने की अवधि पर"],[5,"Fixed-term","तय समय के लिए"]],"rel":"V('job_situation') <= 3"},{"n":"contract_status","m":"K","t":"one","en":"Do you have a signed contract? Yes, signed; yes but not yet signed; no contract.","hi":"क्या आपका दस्तख़त किया हुआ अनुबंध (कॉन्ट्रैक्ट) है? हाँ, दस्तख़त किया; हाँ, पर अभी दस्तख़त नहीं हुआ; कोई अनुबंध नहीं।","opt":false,"c":[[1,"Yes, signed","हाँ, दस्तख़त किया"],[2,"Yes, but not yet signed","हाँ, पर दस्तख़त नहीं हुआ"],[3,"No contract","कोई अनुबंध नहीं"]],"rel":"(V('job_situation') <= 3) && (V('employment_type') == 3 || V('employment_type') == 4)"},{"n":"workplace_registered","m":"K","t":"one","en":"Is your workplace or business registered, for example with a taxpayer or GST number, a shop or trade licence, the Yatra registration, or a union?","hi":"क्या आपका काम या धंधा रजिस्टर्ड है, जैसे GST या टैक्स नंबर, दुकान का लाइसेंस, यात्रा का रजिस्ट्रेशन, या कोई यूनियन?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]],"rel":"V('job_situation') <= 3"},{"n":"pension_contrib","m":"K","t":"one","en":"Do you contribute to any pension system? Yes, the employer deducts it; yes, voluntarily; no.","hi":"क्या आप किसी पेंशन में पैसा डालते हैं? हाँ, मालिक तनख़्वाह से काटता है; हाँ, अपनी मर्ज़ी से डालते हैं; नहीं।","opt":false,"c":[[1,"Yes, employer deducts it","हाँ, मालिक काटता है"],[2,"Yes, contributes voluntarily","हाँ, अपनी मर्ज़ी से"],[3,"No","नहीं"]],"rel":"V('job_situation') <= 3"},{"n":"work_health_ins","m":"K","t":"one","en":"Do you have health insurance through your work? Yes; only private or o e,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]},{"n":"calc_at_work","m":"L","t":"one","en":"In your work, do you work out prices or costs?","hi":"अपने काम में क्या आप दाम या ख़र्चा जोड़ते-घटाते हैं?","opt":false,"c":[[0,"No","नहीं"],[1,"Yes","हाँ"]]}],"mods":[{"c":"P","en":"Cover page, consent and paradata","hi":"आवरण और सहमति","ien":"","ihi":""},{"c":"A","en":"Respondent and household","hi":"आप और आपका घर","ien":"First, a few things about you and the people who live in your household.","ihi":"सबसे पहले आपके बारे में और आपके घर में रहने वाले लोगों के बारे में कुछ बातें पूछूँगा।"},{"c":"B","en":"Work and work history","hi":"काम और काम का इतिहास","ien":"Now about the work you do here on the Yatra route, and the work you did before this.","ihi":"अब उस काम के बारे में जो आप यहाँ यात्रा मार्ग पर करते हैं, और उससे पहले जो काम करते थे।"},{"c":"C","en":"Monthly calendar of work and income; remittances","hi":"साल भर का काम और कमाई","ien":"Now I want to go through the last twelve months, one month at a time. For each month I will ask what work you were mainly doing and where you were living, and then what you usually earned. It is easiest to start with the Yatra months and fill the rest afterwards.","ihi":"अब मैं पिछले बारह महीनों के बारे में, एक-एक महीना करके पूछूँगा। हर महीने के लिए पूछूँगा कि आप मुख्य रूप से क्या काम कर रहे थे और कहाँ रह रहे थे, और फिर यह कि आमतौर पर कितना कमाया। सबसे आसान यह रहता है कि पहले यात्रा वाले महीने भर लें, बाक़ी बाद में।"},{"c":"D","en":"Migration","hi":"आना-जाना और घर की जगह","ien":"Now a few questions about where your home is, and what you do when the Yatra closes for the season.","ihi":"अब कुछ सवाल इस बारे में कि आपका घर कहाँ है, और यात्रा का मौसम ख़त्म होने पर आप क्या करते हैं।"},{"c":"E","en":"Household consumption","hi":"घर का ख़र्च","ien":"Now about what your household usually spends in a month. For each thing I will ask twice -- once for a normal month during the Yatra season, and once for a normal month when the Yatra is closed -- because spending is often quite different in the two. Rough figures are fine.","ihi":"अब यह कि आपके घर का एक महीने में आमतौर पर कितना ख़र्च होता है। हर चीज़ के लिए मैं दो बार पूछूँगा — एक बार यात्रा के मौसम के आम महीने के लिए, और एक बार उस महीने के लिए जब यात्रा बंद रहती है — क्योंकि दोनों में ख़र्च अक्सर काफ़ी अलग होता है। अंदाज़े का हिसाब ही ठीक है।"},{"c":"F","en":"Housing, amenities and assets","hi":"मकान, सुविधाएँ और सामान","ien":"Now some questions about your house and the things your household has.","ihi":"अब आपके घर और घर में मौजूद सामान के बारे में कुछ सवाल।"},{"c":"G","en":"Finance, insurance and schemes","hi":"बैंक, बीमा और योजनाएँ","ien":"Now about savings, loans, insurance and government schemes.","ihi":"अब बचत, क़र्ज़, बीमा और सरकारी योजनाओं के बारे में।"},{"c":"H","en":"Health","hi":"सेहत","ien":"Now a few questions about health in your household. You may leave out any of these.","ihi":"अब आपके घर में सेहत के बारे में कुछ सवाल। इनमें से कोई भी सवाल आप छोड़ सकते हैं।"},{"c":"I","en":"Food security, shocks and coping","hi":"खाना, मुश्किलें और उनसे निपटना","ien":"Now about food, and about any difficult times in the last year and how your household managed.","ihi":"अब खाने के बारे में, और पिछले साल आई किसी मुश्किल के बारे में कि आपके घर ने उसे कैसे सँभाला।"},{"c":"J","en":"Ropeway","hi":"रोपवे","ien":"Now two questions about the ropeway that has been proposed between Gaurikund and Kedarnath.","ihi":"अब गौरीकुंड से केदारनाथ के बीच जो रोपवे प्रस्तावित है, उस पर दो सवाल।"},{"c":"K","en":"Job quality (Apablaza et al. 2026 questions)","hi":"काम की गुणवत्ता","ien":"Now a set of questions about the conditions of your work -- hours, pay, contract and so on. These come from a standard list used in many countries, so one or two may not fit your situation. Say so and we will move on.","ihi":"अब आपके काम के हालात पर कुछ सवाल — घंटे, मज़दूरी, ठेका वग़ैरह। ये एक बनी-बनाई सूची से हैं जो कई देशों में इस्तेमाल होती है, इसलिए एक-दो सवाल आपकी स्थिति पर शायद ठीक न बैठें। बता दीजिएगा, हम आगे बढ़ जाएँगे।"},{"c":"L","en":"Tasks and skills (short block)","hi":"काम-काज और हुनर","ien":"Last, I will read out some kinds of work-tasks and ask whether you do them. There is no right or wrong answer -- we are trying to understand what skills the work here actually uses.","ihi":"आख़िर में, मैं कुछ तरह के कामों के नाम पढ़ूँगा और पूछूँगा कि आप वे करते हैं या नहीं। इसमें सही या ग़लत जवाब कुछ नहीं है — हम बस यह समझना चाहते हैं कि यहाँ के काम में कौन-कौन से हुनर लगते हैं।"}],"cols":["resp_id","enum_id","interview_date","gps_lat","gps_lon","consent","interview_duration_min","dur_tasks_min","age","female","hoh_relation","native_language","native_language_other","marital_status","knows_years_schooling","years_schooling","education_level_cat","hhsize","any_member_6yr_schooling","family_structure","n_earners","main_income_earner","n_children_u15","n_children_6_14","n_children_out_school","occupation","occupation_detail","employment_type","n_other_activities","other_activity_types","other_activity_income_pm","years_in_yatra_work","hours_day_yatra","days_week_yatra","prev_occ_change","prev_occ","target_occ","prev_occ_reason","training_received","training_type","training_type_other","status_m1","status_m2","status_m3","status_m4","status_m5","status_m6","status_m7","status_m8","status_m9","status_m10","status_m11","status_m12","loc_m1","loc_m2","loc_m3","loc_m4","loc_m5","loc_m6","loc_m7","loc_m8","loc_m9","loc_m10","loc_m11","loc_m12","knows_monthly_income","income_m1","income_m2","income_m3","income_m4","income_m5","income_m6","income_m7","income_m8","income_m9","income_m10","income_m11","income_m12","income_annual_total","pct_income_yatra","remit_out_yatra_pm","remit_out_offseason_pm","remit_mode","remit_in_yatra_pm","remit_in_offseason_pm","hours_day_offseason","days_week_offseason","origin","home_state","home_rural_urban","closure_base","years_coming_here","came_here_reason","worked_away_in_closure","closure_work_detail","worked_other_places","other_places_detail","wo function calc(){                            // the two hidden calculates the XLSForm also builds
  let nw = 0, ow = 0;
  for (let m = 1; m <= 12; m++){ const s = +D["status_m" + m]; if (s === 8) nw++; if (s >= 2 && s <= 7) ow++ }

function rebuild(){ shown = CFG.q.filter(visible) }

// ---- rendering
function render(){
  const app = document.getElementById("app");
  rebuild();
  if (!shown.length) return finish();
  // resolve the remembered question; if it has just been hidden by its own gate, fall through to
  // the next still-visible question rather than losing the enumerator's place entirely
  idx = cur === null ? 0 : posOf(cur);
  if (idx >= shown.length) return finish();
  screen = "q";
  const q = shown[idx], mod = CFG.mods.find(m => m.c === q.m);
  cur = q.n;
  const prevMod = idx > 0 ? shown[idx-1].m : null;
  let h = "";
  if (mod && q.m !== prevMod){
    h += "<h2>" + (L ? mod.en : mod.hi) + "</h2>";
    // The module introduction rides on the first visible question of the module rather than sitting
    // on a screen of its own. A separate screen would have cost twelve extra taps per interview and,
    // worse, would have needed an entry in `shown` -- and navigation is keyed on question NAMES via
    // posOf(), so a non-question entry would have broken back/next the moment a gate moved.
    const intro = L ? mod.ien : mod.ihi;
    if (intro) h += "<div class=intro><span class=lead>" + t("readout") + "</span>" + intro + "</div>";
  }
  h += "<div class=card><div class=qn>" + (idx+1) + " / " + shown.length + "</div>";
  h += "<div class=qt>" + (L ? q.en : q.hi) + "</div>";
  if (q.hn) h += "<div class=hint><b>" + t("foryou") + "</b>" + (L ? q.hn : q.hnh) + "</div>";
  const v = D[q.n] ?? "";
  if (q.t === "one" || q.t === "multi"){
    const cur = q.t === "multi" ? SEL(q.n) : [String(v)];
    q.c.forEach(c => {
      const on = cur.includes(String(c[0]));
      h += "<label class='ch" + (on ? " on" : "") + "'><input type=" + (q.t === "multi" ? "checkbox" : "radio") +
           " name=q value='" + c[0] + "'" + (on ? " checked" : "") + "><span>" + (L ? c[1] : c[2]) + "</span></label>";
    });
  } else if (q.t === "text"){
    h += "<input type=text id=f value=\"" + String(v).replace(/"/g,"&quot;") + "\">";
  } else {
    h += "<input type=number id=f inputmode=" + (q.t === "int" ? "numeric" : "decimal") +
         (q.t === "dec" ? " step=any" : "") + " value='" + v + "'>";
  }

  app.querySelectorAll("input").forEach(el => el.addEventListener("input", () => {
    if (q.t === "multi"){
      D[q.n] = [...app.querySelectorAll("input:checked")].map(x => x.value).sort((a,b)=>a-b).join(" ");
    } else if (el.type === "radio"){ D[q.n] = el.value } else { D[q.n] = el.value }

    // could not be revisited and corrected without being thrown forward again, and the timer was
    // never cancelled -- so it could fire after the enumerator had already pressed Back.
  }));

function validate(q){
  const v = D[q.n];
  const blank = v === undefined || v === null || String(v).trim() === "";
  if (blank) return q.opt ? null : t("req");
  if (q.con){ const x = +v; try { if (!eval(q.con)) return L ? q.cmsg_en : q.cmsg_hi } catch(e){} }
  return null;
}
function next(){
  const q = shown[idx], e = validate(q);
  if (e){ const el = document.getElementById("err"); if (el) el.textContent = e; return }
  if (q.n === "consent" && String(D.consent) === "0"){ return finish(true) }
  // recompute AFTER the answer, because the answer may have opened or closed later questions
  rebuild();
  const here = posOf(q.n);
  if (here + 1 >= shown.length){ cur = null; return finish() }
  cur = shown[here + 1].n;
  render();
}
function back(){
  rebuild();
  const here = posOf(cur);
  if (here <= 0) return;
  cur = shown[here - 1].n;
  render();
}

function finish(refused){
  D.__end = new Date().toISOString();
  D.__exported = false;
  const rows = all(); rows.push(D); save(KEY, rows);
  localStorage.removeItem(DKEY);
  D = {};
  lastRefused = !!refused;
  showDone();
}

// Kept separate from finish() so the language toggle can redraw this screen without re-saving the
// interview -- switching language must never write a second copy of the same record.
function showDone(){
  screen = "done";
  document.getElementById("nav").style.display = "none";
  document.getElementById("app").innerHTML =
    "<div class=mid><div class=big>" + (lastRefused ? t("stop") : t("done")) + "</div>" +
    "<p>" + pending() + " " + t("pend") + "</p>" +
    "<p><button class=p onclick='start()'>" + t("start") + "</button></p>" +
    "<p><button onclick='exportCsv()'>" + t("exp") + "</button></p>" +
    "<p><button onclick='exportCsv(1)'>" + t("expl") + "</button></p></div>";
  paint();
}

function start(){
  D = { __start: new Date().toISOString() };
  // GPS is requested once, at the start, and never blocks the interview if it is refused or slow
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
    p => { D.gps_lat = p.coords.latitude.toFixed(5); D.gps_lon = p.coords.longitude.toFixed(5); save(DKEY, D) },
    () => {}, {timeout: 20000, enableHighAccuracy: true});
  D.interview_date = new Date().toISOString().slice(0,10);
  idx = 0; cur = null; save(DKEY, D); render();
}

// ---- export: exactly the raw_asked.csv column order the Stata build reads
function csvCell(s){ s = s === undefined || s === null ? "" : String(s);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s }
// Code -> the option text that was actually chosen. Multi-selects are stored as space-separated
// codes, so each one is mapped and the labels rejoined with "; " -- a semicolon, not a comma, so a
// labelled multi-select never needs quoting and can never be mistaken for a column break.
function labelOf(col, v){
  const m = CFG.labs[col];
  if (!m || v === undefined || v === null || String(v).trim() === "") return v;
  return String(v).trim().split(/\s+/).map(x => (m[x] ? (L ? m[x].e : m[x].h) : x)).join("; ");
}
// labelled falsy -> the numeric codes the Stata build reads. labelled truthy -> what the respondent
// actually chose. Same rows, same column order; only coded columns differ, and numbers, dates and
// verbatim text are identical either way.
function exportCsv(labelled){
  const rows = all();
  if (!rows.length) return alert(t("nodata"));
  const cols = CFG.cols;
  let out = cols.join(",") + "\n";
  rows.forEach((r,i) => {
    r.resp_id = r.resp_id || (Date.now() + "" + i).slice(-9);
    out += cols.map(c => csvCell(labelled ? labelOf(c, r[c]) : r[c])).join(",") + "\n";
  });
  const blob = new Blob(["\ufeff" + out], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kedarnath_" + new Date().toISOString().slice(0,10) + "_" + rows.length +
               (labelled ? (L ? "_labels_en" : "_labels_hi") : "") + ".csv";
  a.click();
  // Only the coded export marks records as delivered. Taking a readable copy to check the day's work
  // must not make the interviews look already handed over -- clearExported() deletes on that flag,
  // and losing interviews to a reading convenience would be the worst trade in this whole form.
  if (!labelled){ rows.forEach(r => r.__exported = true); save(KEY, rows) }
  paint();
}
function menu(){
  screen = "menu";
  const rows = all();

    "<tr><td>" + t("cnt") + "</td><td align=right><b>" + rows.length + "</b></td></tr>" +
    "<tr><td>" + t("pend") + "</td><td align=right><b>" + pending() + "</b></td></tr></table></div>" +
    "<div class=card><p><button class=p style=width:100% onclick='start()'>" + t("start") + "</button></p>" +
    "<p><button style=width:100% onclick='exportCsv()'>" + t("exp") + "</button></p>" +
    "<p><button style=width:100% onclick='exportCsv(1)'>" + t("expl") + "</button></p>" +

}
function clearExported(){

  if (!confirm((all().length - keep.length) + " exported interviews will be deleted from this device.")) return;
  save(KEY, keep); menu();
}

// ---- offline support. Without this the form must be fetched from the network every time it is

// first visit; afterwards the tablet needs no connectivity to start an interview.
//
// Updates are deliberately NOT applied automatically: swapping the form out mid-interview would be
// worse than running a version behind. A new build installs and waits, a banner appears, and it
// takes effect the next time the form is fully closed and reopened.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) {
          const b = document.getElementById("upd");
          b.textContent = L ? "A new version of the form is ready. Close it completely and reopen."
                             : "फ़ॉर्म का नया रूप तैयार है। इसे पूरी तरह बंद करके दोबारा खोलें।";
          b.style.display = "block";
        }
      });
    });
  }).catch(() => {});   // an unsupported browser must still run the form, just without offline
}

const draft = load(DKEY, null);
if (draft && Object.keys(draft).length > 2 && confirm("Resume the unfinished interview?")){ D = draft; idx = 0; cur = null; render() }
else menu();
</script>
